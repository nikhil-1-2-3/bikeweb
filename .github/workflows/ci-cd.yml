name: CI/CD Pipeline - Test, Scan, Build & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: bikeweb
  K8S_NAMESPACE: motor-house

permissions:
  contents: read
  packages: write

jobs:
  # ── Phase 1: Unit & Syntax Validation Tests ────────────────────────────────
  test:
    name: Test & Validate (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            path: frontend
            type: frontend
          - service: api-gateway
            path: backend/api-gateway
            type: backend
          - service: auth-service
            path: backend/auth-service
            type: backend
          - service: bike-service
            path: backend/bike-service
            type: backend
          - service: booking-service
            path: backend/booking-service
            type: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install Dependencies
        run: |
          cd ${{ matrix.path }}
          npm ci

      - name: Run Backend Syntax Validation Tests
        if: matrix.type == 'backend'
        run: |
          cd ${{ matrix.path }}
          npm test --if-present

      - name: Verify Frontend Production Build
        if: matrix.type == 'frontend'
        run: |
          cd ${{ matrix.path }}
          npm run build

  # ── Phase 2: Build, Trivy Security Scan & GHCR Publish ───────────────────
  build-scan-publish:
    name: Build, Scan & Push (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: bikeweb-frontend
          - name: api-gateway
            context: ./backend/api-gateway
            dockerfile: ./backend/api-gateway/Dockerfile
            image_name: bikeweb-api-gateway
          - name: auth-service
            context: ./backend/auth-service
            dockerfile: ./backend/auth-service/Dockerfile
            image_name: bikeweb-auth-service
          - name: bike-service
            context: ./backend/bike-service
            dockerfile: ./backend/bike-service/Dockerfile
            image_name: bikeweb-bike-service
          - name: booking-service
            context: ./backend/booking-service
            dockerfile: ./backend/booking-service/Dockerfile
            image_name: bikeweb-booking-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Local Image for Vulnerability Scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image_name }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Validated Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ── Phase 3: Automated Kubernetes CD Deployment (Rolling Update) ─────────
  deploy:
    name: Continuous Deployment to Kubernetes
    needs: build-scan-publish
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Execute Zero-Downtime Rolling Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail
            IMAGE_TAG="sha-${{ github.sha }}"
            OWNER="${{ steps.owner.outputs.owner }}"
            NS="${{ env.K8S_NAMESPACE }}"

            echo "=== Deploying image tag: $IMAGE_TAG ==="

            # Update deployment image references
            kubectl set image deployment/frontend frontend=ghcr.io/$OWNER/bikeweb-frontend:$IMAGE_TAG -n $NS
            kubectl set image deployment/api-gateway api-gateway=ghcr.io/$OWNER/bikeweb-api-gateway:$IMAGE_TAG -n $NS
            kubectl set image deployment/auth-service auth-service=ghcr.io/$OWNER/bikeweb-auth-service:$IMAGE_TAG -n $NS
            kubectl set image deployment/bike-service bike-service=ghcr.io/$OWNER/bikeweb-bike-service:$IMAGE_TAG -n $NS
            kubectl set image deployment/booking-service booking-service=ghcr.io/$OWNER/bikeweb-booking-service:$IMAGE_TAG -n $NS

            # Verify rolling update status
            kubectl rollout status deployment/frontend -n $NS --timeout=120s
            kubectl rollout status deployment/api-gateway -n $NS --timeout=120s
            kubectl rollout status deployment/auth-service -n $NS --timeout=120s
            kubectl rollout status deployment/bike-service -n $NS --timeout=120s
            kubectl rollout status deployment/booking-service -n $NS --timeout=120s

            echo "=== Deployment rollout completed successfully ==="


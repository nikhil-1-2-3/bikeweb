name: CI/CD - Build & Publish Container Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: nikhil-1-2-3

jobs:
  # ── 1. Detect Changes per Service ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      gateway:  ${{ steps.filter.outputs.gateway }}
      auth:     ${{ steps.filter.outputs.auth }}
      bikes:    ${{ steps.filter.outputs.bikes }}
      booking:  ${{ steps.filter.outputs.booking }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'
            gateway:
              - 'backend/api-gateway/**'
              - '.github/workflows/ci-cd.yml'
            auth:
              - 'backend/auth-service/**'
              - '.github/workflows/ci-cd.yml'
            bikes:
              - 'backend/bike-service/**'
              - '.github/workflows/ci-cd.yml'
            booking:
              - 'backend/booking-service/**'
              - '.github/workflows/ci-cd.yml'

  # ── 2. Lint & Test ─────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - backend/api-gateway
          - backend/auth-service
          - backend/bike-service
          - backend/booking-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Run Tests (if present)
        run: |
          cd ${{ matrix.service }}
          npm test --if-present

  # ── 3. Build & Push Docker Images to GHCR ──────────────────────────────────
  build-and-push:
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image_name: bikeweb-frontend
            should_run: ${{ needs.changes.outputs.frontend }}
          - name: api-gateway
            context: ./backend/api-gateway
            image_name: bikeweb-api-gateway
            should_run: ${{ needs.changes.outputs.gateway }}
          - name: auth-service
            context: ./backend/auth-service
            image_name: bikeweb-auth-service
            should_run: ${{ needs.changes.outputs.auth }}
          - name: bike-service
            context: ./backend/bike-service
            image_name: bikeweb-bike-service
            should_run: ${{ needs.changes.outputs.bikes }}
          - name: booking-service
            context: ./backend/booking-service
            image_name: bikeweb-booking-service
            should_run: ${{ needs.changes.outputs.booking }}

    # Trigger build if specific service changed, on tag push, or manual workflow_dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      matrix.should_run == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner on Image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0' # Non-blocking in CI initial rollout, change to 1 to enforce blocking
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

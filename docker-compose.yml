networks:
  motor-net:
    driver: bridge

volumes:
  postgres_data:

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: motor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB:       postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - motor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Auth Service ───────────────────────────────────────────
  auth-service:
    build: ./backend/auth-service
    container_name: motor-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT:            4001
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_USER:         ${DB_USER:-postgres}
      DB_PASSWORD:     ${DB_PASSWORD:-postgres}
      AUTH_DB_NAME:    auth_db
      JWT_SECRET:      ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3000
    networks:
      - motor-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Bike Service ───────────────────────────────────────────
  bike-service:
    build: ./backend/bike-service
    container_name: motor-bikes
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT:            4002
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_USER:         ${DB_USER:-postgres}
      DB_PASSWORD:     ${DB_PASSWORD:-postgres}
      BIKE_DB_NAME:    bike_db
      JWT_SECRET:      ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3000
    networks:
      - motor-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Booking Service ────────────────────────────────────────
  booking-service:
    build: ./backend/booking-service
    container_name: motor-booking
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bike-service:
        condition: service_healthy
    environment:
      PORT:             4003
      DB_HOST:          postgres
      DB_PORT:          5432
      DB_USER:          ${DB_USER:-postgres}
      DB_PASSWORD:      ${DB_PASSWORD:-postgres}
      BOOKING_DB_NAME:  booking_db
      JWT_SECRET:       ${JWT_SECRET:-change-me-in-production}
      BIKE_SERVICE_URL: http://bike-service:4002
      ALLOWED_ORIGINS:  http://localhost:3000
    networks:
      - motor-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── API Gateway ────────────────────────────────────────────
  api-gateway:
    build: ./backend/api-gateway
    container_name: motor-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_healthy
      bike-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    environment:
      PORT:                4000
      AUTH_SERVICE_URL:    http://auth-service:4001
      BIKE_SERVICE_URL:    http://bike-service:4002
      BOOKING_SERVICE_URL: http://booking-service:4003
      FRONTEND_URL:        http://localhost:3000
      JWT_SECRET:          ${JWT_SECRET:-change-me-in-production}
    networks:
      - motor-net

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: motor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - motor-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

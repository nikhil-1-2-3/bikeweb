apiVersion: v1
kind: Service
metadata:
  name: bike-service
  namespace: motor-house
  labels:
    app.kubernetes.io/name: bike-service
spec:
  type: ClusterIP
  ports:
    - port: 4002
      targetPort: 4002
      name: http
  selector:
    app.kubernetes.io/name: bike-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bike-service
  namespace: motor-house
  labels:
    app.kubernetes.io/name: bike-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bike-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bike-service
    spec:
      containers:
        - name: bike-service
          image: ghcr.io/nikhil-1-2-3/bikeweb-bike-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
              name: http
          envFrom:
            - configMapRef:
                name: motor-house-config
            - secretRef:
                name: motor-house-secrets
          env:
            - name: PORT
              value: "4002"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 4002
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 10
